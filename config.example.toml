# aiaiai configuration

# OpenAI-compatible endpoint. The trailing /v1 is optional, both forms work.
# Examples: http://localhost:11434/v1 (Ollama), http://localhost:1234/v1
# (LM Studio), https://api.openai.com/v1, or your own gateway.
base_url = "http://localhost:11434/v1"
model    = "llama3.2"
api_key  = "not-required"

# What aiaiai does with the answer:
#   "command" -> print only the command
#   "explain" -> print the command plus a short explanation
#   "confirm" -> print it, then ask before running   (default)
#   "auto"    -> run it immediately, no questions asked
mode = "confirm"

# Shell used to run commands. "auto" follows $SHELL on unix and PowerShell on
# Windows; set it to bash, zsh, fish, pwsh, ... to pin one.
shell = "auto"

# Seconds to wait for the model before giving up.
timeout = 90

# Send the working directory listing as context so the model uses real names.
context = true
max_context_entries = 40

# Tell the model which commands exist on your PATH, so it suggests rg when you
# have rg and grep when you do not. extra_tools adds your own to the probe list.
tools = true
extra_tools = []

temperature = 0.2
